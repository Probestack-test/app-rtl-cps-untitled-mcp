name: CI/CD - untitled Deploy to Cloud Run

on:
  push:
    # The development branch, plus the CI/CD profile's "merge" branch when there is one.
    branches:
      - 'feature-adarsha'
      - 'release'
    # Documentation-only changes never affect the deployed image.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'postman/**'
      - '.gitignore'
      - '.github/CODEOWNERS'
      - 'LICENSE'
  workflow_dispatch:

# A newer push to the same branch replaces an in-flight run instead of racing it.
concurrency:
  group: untitled-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID:                 probestack-prod
  REGION:                     us-central1
  SERVICE_NAME:               untitled
  REPOSITORY:                 probestack-prod-apps
  SERVICE_ACCOUNT_EMAIL:      github-actions-forgecrux@probestack-prod.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  ARTIFACT_REGISTRY_HOST:     us-central1-docker.pkg.dev
  CONTAINER_PORT:             "8080"
  MCP_PATH:                   "/mcp"
  HEALTH_PATH:                "/health"
  MCP_LANGUAGE:               TYPESCRIPT

jobs:
  # ───────────────────────── 1. Build and test ─────────────────────────
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Security scan (npm audit)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

  # ───────────────── 2. Build the image and deploy to Cloud Run ─────────────────
  deploy:
    name: deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feature-adarsha' || github.ref == 'refs/heads/release')

    permissions:
      contents: read
      id-token: write

    outputs:
      service_url: ${{ steps.svcurl.outputs.service_url }}
      mcp_url:     ${{ steps.svcurl.outputs.mcp_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The server refuses to start without its credentials, so fail here with a clear message
      # instead of with a Cloud Run revision that never becomes ready.
      - name: Verify required secrets
        env:
          MCP_API_KEYS: ${{ secrets.MCP_API_KEYS || 'mcp_3e48063312f04bffd43acc9fb3662759bf328460018e8ec5' }}
        run: |
          missing=0
          for name in MCP_API_KEYS; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set. Add it under Settings > Secrets and variables > Actions, or run: gh secret set $name"
              missing=1
            fi
          done
          exit $missing

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ env.SERVICE_ACCOUNT_EMAIL }}
          token_format:               access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY_HOST }} --quiet

      - name: Build and Push Docker Image
        id: image
        run: |
          IMAGE_NAME=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}
          docker build -t ${IMAGE_NAME}:${{ github.sha }} -t ${IMAGE_NAME}:latest .
          docker push ${IMAGE_NAME}:${{ github.sha }}
          # A stable tag alongside the immutable sha one: :latest always resolves to the most
          # recent successful build, so a stdio client config can reference the image without
          # tracking which sha was last pushed (there is no Cloud Run revision to read that from).
          docker push ${IMAGE_NAME}:latest
          # Ask Artifact Registry to confirm the push, rather than assuming it from the tag this
          # job happened to use -- the digest below is what Artifact Registry itself reports for
          # that tag, right now, not a guessed or hardcoded value.
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE_NAME}:${{ github.sha }}" \
            --format='value(image_summary.digest)')
          if [ -z "$DIGEST" ]; then
            echo "::error::Artifact Registry did not report a digest for ${IMAGE_NAME}:${{ github.sha }} after push."
            exit 1
          fi
          echo "image=${IMAGE_NAME}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}"                       >> "$GITHUB_OUTPUT"

      - name: Write Image Reference to Step Summary
        run: |
          {
            echo "## Container image published"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Image**  | \`${{ steps.image.outputs.image }}\` |"
            echo "| **Digest** | \`${{ steps.image.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Image Reference as Artifact File
        run: |
          jq -n \
            --arg image "${{ steps.image.outputs.image }}" \
            --arg digest "${{ steps.image.outputs.digest }}" \
            --arg sha "${{ github.sha }}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{image: $image, digest: $digest, sha: $sha, publishedAt: $publishedAt}' \
            > "${{ github.workspace }}/.image-ref.json"
          test -s "${{ github.workspace }}/.image-ref.json" || {
            echo "::error::.image-ref.json was not written -- the image reference artifact will be missing."
            exit 1
          }

      - name: Upload Image Reference Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: ${{ github.workspace }}/.image-ref.json
          if-no-files-found: ignore
        continue-on-error: true

      - name: Deploy to Cloud Run
        if: false
        env:
          MCP_API_KEYS: ${{ secrets.MCP_API_KEYS || 'mcp_3e48063312f04bffd43acc9fb3662759bf328460018e8ec5' }}
          UPSTREAM_BASE_URL: ${{ vars.UPSTREAM_BASE_URL }}
        run: |
          IMAGE_NAME=${{ env.ARTIFACT_REGISTRY_HOST }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}
          # Environment variables go through a file so values containing commas (a list of API keys) survive.
          jq -n --arg MCP_API_KEYS "$MCP_API_KEYS" --arg UPSTREAM_BASE_URL "$UPSTREAM_BASE_URL" \
            '{MCP_API_KEYS: $MCP_API_KEYS, UPSTREAM_BASE_URL: $UPSTREAM_BASE_URL} | with_entries(select(.value != ""))' > "$RUNNER_TEMP/env.json"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${IMAGE_NAME}:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=${{ env.CONTAINER_PORT }} \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=300 \
            --concurrency=80 \
            --service-account=${{ env.SERVICE_ACCOUNT_EMAIL }} \
            --env-vars-file="$RUNNER_TEMP/env.json" \
            --quiet
          rm -f "$RUNNER_TEMP/env.json"

      - name: Get Service URL
        id: svcurl
        if: false
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          MCP_URL="${SERVICE_URL}${MCP_PATH}"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "mcp_url=${MCP_URL}"         >> "$GITHUB_OUTPUT"

      - name: Write Deployed URL to Step Summary
        if: false
        run: |
          {
            echo "## MCP server deployed"
            echo ""
            echo "| | URL |"
            echo "| --- | --- |"
            echo "| **Service**  | ${{ steps.svcurl.outputs.service_url }} |"
            echo "| **MCP endpoint** | \`${{ steps.svcurl.outputs.mcp_url }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Deployed URL as Artifact File
        if: false
        run: |
          jq -n \
            --arg service "${{ env.SERVICE_NAME }}" \
            --arg region "${{ env.REGION }}" \
            --arg url "${{ steps.svcurl.outputs.service_url }}" \
            --arg mcpUrl "${{ steps.svcurl.outputs.mcp_url }}" \
            --arg sha "${{ github.sha }}" \
            --arg deployedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{service: $service, region: $region, url: $url, mcpUrl: $mcpUrl, sha: $sha, deployedAt: $deployedAt}' \
            > "${{ github.workspace }}/.deploy-url.json"
          test -s "${{ github.workspace }}/.deploy-url.json" || {
            echo "::error::.deploy-url.json was not written -- the deployment URL artifact will be missing."
            exit 1
          }

      - name: Upload Deployed URL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-url
          path: ${{ github.workspace }}/.deploy-url.json
          if-no-files-found: ignore
        continue-on-error: true
